<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WebsiteBlocker</title><link rel="stylesheet" href="studio.css"><style>body{width:370px}main{padding:24px}h1{font-size:32px;letter-spacing:-1px;margin:24px 0 12px}.brand{font-size:16px}.metrics{grid-template-columns:1fr 1fr;margin:18px 0;padding:16px 0}.metrics strong{font-size:26px}.button-row{margin-top:20px}.button-row button{flex:1}.intro{font-size:12px}#error{color:#b84935;font-size:12px;line-height:1.6}label{margin:10px 0}.timer{font-size:40px}</style></head><body><main><div class="brand"><img src="icon32.png" width="24" height="24" alt="">WebsiteBlocker</div><h1 data-i18n="Your focus, protected">Your focus, protected</h1><p id="active" class="intro"></p><div class="metrics"><div><strong id="total">0</strong><span data-i18n="distractions stopped">distractions stopped</span></div><div><strong id="today">0</strong><span data-i18n="focus wins today">focus wins today</span></div></div><p id="timer" class="timer"></p><form id="quick-start"><label><span data-i18n="Website list">Website list</span><select id="group"></select></label><label><span data-i18n="Duration">Duration</span><select id="minutes"><option value="25">25 min</option><option value="50">50 min</option><option value="90">90 min</option></select></label><button class="primary" data-i18n="Start focus">Start focus</button></form><p id="error" role="status"></p><p id="details" class="muted"></p><div class="button-row"><button id="manage" data-i18n="Open focus studio">Open focus studio</button><button id="sync" class="quiet" data-i18n="Sync with desktop">Sync with desktop</button></div></main><script type="module" src="popup.js"></script></body></html>
