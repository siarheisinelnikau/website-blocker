[package]
name = "website-blocker"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Local website focus rules and schedules with a Chromium companion"
repository = "https://github.com/siarheisinelnikau/website-blocker"

[dependencies]
rust-auto-updator = { path = "../rust-auto-updator/crates/rust-auto-updator" }
chrono = { version = "0.4.45", features = ["serde"] }
egui = { version = "=0.33.3", features = ["default_fonts"] }
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard"] }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
softbuffer = { version = "=0.4.8", default-features = false }
fs2 = "0.4.3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3.27"
url = "2.5"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Security", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

