[package]
name = "website-blocker"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Local website focus rules and schedules with a Chromium companion"
repository = "https://github.com/siarheisinelnikau/website-blocker"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
fs2 = "0.4.3"
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3.27"
ureq = { version = "3.5", features = ["json"] }
url = "2.5"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }


